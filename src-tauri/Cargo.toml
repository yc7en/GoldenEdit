[package]
name = "goldenedit"
version = "0.5.0"
description = "GoldenEdit · 把 Markdown 当源码，把预览当可插拔的渲染目标"
authors = ["Leo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "goldenedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
trash = "5"
rfd = "0.17"
open = "5"
sha2 = "0.10"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
