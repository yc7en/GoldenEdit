name: build

# 触发：主干提交、版本标签（GoldenEdit/v*）、手动。
# 为什么需要 CI 出 macOS 包：dmg 依赖 hdiutil、链接依赖 Xcode SDK，Windows 上无法交叉编译
# （ARCHITECTURE §15.3）。
on:
  push:
    branches: [main]
    tags: ['GoldenEdit/v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal
    # 不能用 macos-14：该镜像 2026-11-02 退役，job 会在分配机器前被判失败
    # （注解 "The configuration 'macos-14-arm64-us-default' is not supported"）。
    # 用 macos-15 而非 macos-latest，避免 Xcode 随镜像升级悄悄改变产物。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 工具链（含两个 macOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 前端依赖
        run: npm ci

      - name: 构建 universal dmg
        uses: tauri-apps/tauri-action@v0
        with:
          # beforeBuildCommand 会自动跑 npm run build（主页面 + 预览外壳）
          args: --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: GoldenEdit-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows NSIS + MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 前端依赖
        run: npm ci

      - name: 构建 NSIS 与 MSI
        uses: tauri-apps/tauri-action@v0

      - uses: actions/upload-artifact@v4
        with:
          name: GoldenEdit-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # 只有版本标签才发 Release；主干提交与手动触发只产出 artifact（验证构建，不发版）。
  # 单独成 job 而不是让 tauri-action 直接发：两个平台的构建并行，各自建 Release 会互相竞争。
  release:
    name: 发布 Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/GoldenEdit/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          # ref_name 本身已带 GoldenEdit/ 前缀，不要再加一遍
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### 下载

            | 平台 | 文件 |
            |---|---|
            | Windows 10/11 | `..._x64-setup.exe`（NSIS 安装包）、`..._x64_zh-CN.msi` |
            | macOS 13+ | `..._universal.dmg`（Apple Silicon 与 Intel 通用） |

            ### 注意

            - macOS 产物**未做代码签名与公证**，首次打开请右键选择「打开」放行，直接双击会被系统拦下。
            - 变更说明见 [`docs/ChangeLog.md`](docs/ChangeLog.md)。
          files: |
            dist/GoldenEdit-macos-universal/*
            dist/GoldenEdit-windows/**/*
